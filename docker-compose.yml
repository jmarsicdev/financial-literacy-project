services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_literacy}
      POSTGRES_USER: ${POSTGRES_USER:-team5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./backend/sql/migrations/001_financial_ontology.sql:/docker-entrypoint-initdb.d/002-financial-ontology.sql:ro
      - ./backend/sql/migrations/004_gold_symbol_metrics.sql:/docker-entrypoint-initdb.d/004-gold-symbol-metrics.sql:ro
      - ./backend/sql/migrations/005_risk_profiles.sql:/docker-entrypoint-initdb.d/005-risk-profiles.sql:ro
      - ./backend/sql/migrations/002_seed_financial_ontology.sql:/docker-entrypoint-initdb.d/003-seed-financial-ontology.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-team5} -d ${POSTGRES_DB:-financial_literacy}"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-team5}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-financial_literacy}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ALPHA_VANTAGE_DAILY_LIMIT: ${ALPHA_VANTAGE_DAILY_LIMIT:-25}
      HF_TOKEN: ${HF_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      ASK_CACHE_TTL_SECONDS: ${ASK_CACHE_TTL_SECONDS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["8000:8605"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # lets LLM_BASE_URL reach an Ollama running on the host
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  spark:
    build: ./spark
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-team5}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-financial_literacy}
      PYSPARK_PYTHON: python3
      PYTHONPATH: /opt          # lets jobs and tests import backend.app.spark
    volumes:
      - ./spark:/opt/spark-app
      - ./backend/app:/opt/backend/app:ro
      - ./backend/tests:/opt/backend/tests:ro
    working_dir: /opt/spark-app
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-lc", "sleep infinity"]
  ollama:
    # optional local model server: `docker compose --profile local-llm up -d`, then
    # `docker compose exec ollama ollama pull qwen2.5:7b-instruct` once; set LLM_BASE_URL=http://ollama:11434/v1 in .env
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes: [ollama_models:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
  ollama_models:
